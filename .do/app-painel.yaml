# Spec da DigitalOcean App Platform para apps/painel.
# Mesmo processo do app-landing.yaml: "Create App" -> Igorbriano2/Vetor -> "Edit Your App Spec".
name: vetor-painel
region: nyc
services:
  - name: painel
    github:
      repo: Igorbriano2/Vetor
      branch: main
      deploy_on_push: true
    source_dir: apps/painel
    environment_slug: node-js
    # build/start usam output "standalone" do Next (ver next.config.ts) — mesmo
    # motivo do app-landing.yaml.
    build_command: npm run build
    run_command: npm run start
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://rhqkzhiuweiblfkfsqxm.supabase.co"
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        scope: RUN_AND_BUILD_TIME
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJocWt6aGl1d2VpYmxma2ZzcXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjk3OTAsImV4cCI6MjEwMTk0NTc5MH0.-uLmyhaW4w6VYgQdMKG3pDP_rFimXeOZo3Qur-DvU3M"
      - key: AGENTES_API_URL
        scope: RUN_TIME
        value: "https://api.vetormkt.online"
      - key: INTERNAL_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        # MESMO valor usado no app "agentes" -- e o que autentica painel -> agentes.
domains:
  - domain: painel.vetormkt.online
    type: PRIMARY
