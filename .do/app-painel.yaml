# Spec da DigitalOcean App Platform para apps/painel.
# Mesmo processo do app-landing.yaml: "Create App" -> Igorbriano2/Vetor -> "Edit Your App Spec".
name: vetor-painel
region: nyc
services:
  - name: painel
    github:
      repo: Igorbriano2/Vetor
      branch: main
      deploy_on_push: true
    source_dir: apps/painel
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start
    instance_size_slug: basic-xxs
    instance_count: 1
