# Spec da DigitalOcean App Platform para apps/agentes (backend: webhooks do WhatsApp
# e do Asaas). Mesmo processo dos outros dois arquivos.
#
# Os campos SECRET abaixo ficam em branco de propósito — preencha na tela da DO
# antes de aplicar o spec, nunca aqui no arquivo. Enquanto WHATSAPP_MODE=sandbox e
# ASAAS_ENV=sandbox, o serviço sobe e responde ao /health normalmente mesmo sem as
# chaves reais preenchidas (ver docs/STATUS.md).
name: vetor-agentes
region: nyc
services:
  - name: agentes
    github:
      repo: Igorbriano2/Vetor
      branch: main
      deploy_on_push: true
    source_dir: apps/agentes
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: SUPABASE_URL
        scope: RUN_TIME
        value: "https://rhqkzhiuweiblfkfsqxm.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_MODE
        scope: RUN_TIME
        value: "sandbox"
      - key: WHATSAPP_PHONE_NUMBER_ID
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: ASAAS_ENV
        scope: RUN_TIME
        value: "sandbox"
      - key: ASAAS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ASAAS_WEBHOOK_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: STT_PROVIDER
        scope: RUN_TIME
        value: "openai"
        # Precisa ser "openai" (nao "sandbox") pra transcricao de audio real
        # funcionar - usado pelo Secretario (WhatsApp) e pelo assistente de
        # voz (wake word). Reusa a mesma OPENAI_API_KEY abaixo.
      - key: TTS_PROVIDER
        scope: RUN_TIME
        value: "sandbox"
        # NAO mexer aqui sem checar o valor real na DigitalOcean primeiro:
        # ha evidencia (scripts em scratchpad/apply_fish_audio.sh) de que a
        # producao pode ja estar rodando TTS_PROVIDER=fish (voz clonada
        # propria via Fish Audio) aplicado direto pela API, sem passar por
        # este arquivo - sobrescrever aqui e fazer deploy poderia REGREDIR
        # a voz de producao pra uma generica. So mude isto depois de
        # confirmar o valor atual via GET /v2/apps/{id}.
      - key: TTS_VOICE
        scope: RUN_TIME
        value: "onyx"
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: INTERNAL_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        # Gere uma string aleatoria longa e use o MESMO valor no app "agentes" e no app "painel"
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        # Necessario para o Mission Orchestrator (fila BullMQ). Sem isso, o server HTTP
        # sobe normalmente (/health ok) mas criar uma missao (POST /plataforma/missoes)
        # falha ao tentar enfileirar. Ver docs/STATUS.md "Mission Orchestrator" antes de
        # preencher — provisionar Redis tem custo recorrente e precisa de confirmacao.
domains:
  - domain: api.vetormkt.online
    type: PRIMARY
workers:
  - name: mission-worker
    github:
      repo: Igorbriano2/Vetor
      branch: main
      deploy_on_push: true
    source_dir: apps/agentes
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start:worker
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: SUPABASE_URL
        scope: RUN_TIME
        value: "https://rhqkzhiuweiblfkfsqxm.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        # MESMO valor usado no service "agentes" acima.
      # Processo consumidor da fila de missoes (BullMQ) — nao expoe HTTP, so
      # roda src/workers/missionWorker.ts. Sem REDIS_URL ele falha ja na
      # inicializacao (por design, ver src/queue/connection.ts).
